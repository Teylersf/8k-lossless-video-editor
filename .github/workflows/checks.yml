name: Editor checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STUDIO_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install CPU media prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m venv .venv-editor
          .venv-editor/bin/python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-editor/bin/python -m pip install --only-binary=:all: -r engine/requirements.txt
          .venv-editor/bin/python -m pip check
      - name: Build, lint and test actual client state
        run: |
          npm --prefix app ci
          npm --prefix app run build
          npm --prefix app run lint
          npm --prefix app test
      - name: API and media library integration tests
        run: .venv-editor/bin/python -m unittest discover -s . -p 'test_*.py' -v
      - name: Offline release-source collector checks
        run: .venv-editor/bin/python scripts/collect_release_sources.py --self-test
      - name: Actual CPU timeline and codec round trips
        run: .venv-editor/bin/python -m unittest discover -s engine -p 'test_*.py' -v
  macos-arm64:
    # GitHub documents macos-15 as a standard ARM64 runner; no paid -large tier.
    runs-on: macos-15
    timeout-minutes: 40
    env:
      STUDIO_DEVICE: cpu
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements-macos.txt
            engine/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Assert native architecture and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          python -c "import platform,sys; print(sys.version,platform.machine()); assert platform.machine()=='arm64'"
          node -e "console.log(process.version,process.arch); if(process.arch!=='arm64') process.exit(1)"
          for script in *.command; do bash -n "$script"; done
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.command'):
              assert b'\r' not in path.read_bytes(), f'{path} must have LF line endings'
          PY
      - name: Provide full HDR-capable FFmpeg without global linking
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_full_bin="$(brew --prefix)/opt/ffmpeg-full/bin"
          export PATH="$ffmpeg_full_bin:$PATH"
          have_filters() {
            command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || return 1
            local filters
            filters="$(ffmpeg -hide_banner -filters 2>/dev/null)" || return 1
            printf '%s\n' "$filters" | awk '$2=="zscale"{z=1} $2=="tonemap"{t=1} $2=="amix"{m=1} $2=="atrim"{r=1} $2=="atempo"{a=1} END{exit !(z&&t&&m&&r&&a)}'
          }
          if ! have_filters; then brew install ffmpeg-full; fi
          have_filters || { printf 'Required FFmpeg HDR/audio filters are missing.\n' >&2; exit 1; }
          printf '%s\n' "$ffmpeg_full_bin" >> "$GITHUB_PATH"
          ffmpeg -version
          ffprobe -version
      - name: Install pinned native packages and run actual Mac setup
        shell: bash
        run: |
          python -m venv .venv-editor
          .venv-editor/bin/python -m pip install --only-binary=:all: -r requirements-macos.txt
          PYTHON3="$(command -v python)" bash "SETUP MAC.command"
      - name: Client lint and state tests
        run: |
          npm --prefix app run lint
          npm --prefix app test
      - name: API and actual CPU codec/timeline tests on ARM64
        run: |
          .venv-editor/bin/python -m unittest discover -s . -p 'test_*.py' -v
          .venv-editor/bin/python -m unittest discover -s engine -p 'test_*.py' -v
      - name: Report MPS and run a small actual Metal timeline if available
        shell: bash
        run: |
          .venv-editor/bin/python - <<'PY'
          import json, os, platform, sys, tempfile
          from pathlib import Path
          import torch
          from PIL import Image
          sys.path.insert(0, 'engine')
          import editor_pipeline
          from runtime_backend import backend_info
          report = {'architecture': platform.machine(), 'torch': torch.__version__,
                    'mps_built': torch.backends.mps.is_built(), 'mps_available': torch.backends.mps.is_available()}
          assert report['architecture'] == 'arm64'
          if report['mps_available']:
              os.environ['STUDIO_DEVICE'] = 'mps'
              with tempfile.TemporaryDirectory(prefix='editor-metal-ci-') as temporary:
                  folder = Path(temporary)
                  source = folder / 'source.png'
                  Image.new('RGB', (128,96), (160,100,40)).save(source)
                  project = {'schema_version':1,'name':'Small Metal CI','width':128,'height':96,'fps':'16/1',
                             'tracks':[{'id':'video','kind':'video','clips':[{'id':'clip','media_id':'source','duration':0.125,'lens':{'amount':0.65}}]}]}
                  media = {'source':{'path':str(source),'public':{'kind':'image','duration':0,'transfer':'srgb','color_primaries':'bt709','audio_streams':0}}}
                  result = editor_pipeline.render_project(project,media,folder/'result.mkv')
                  assert result['frames']==2 and result['backend']['device']=='mps', result
                  report.update(backend=backend_info('mps'), small_timeline='passed', verification=result['verification'])
          else:
              report['small_timeline']='skipped: MPS unavailable on this runner'
          print(json.dumps(report,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('Native Mac observation\n\n'+json.dumps(report,indent=2)+'\n\n')
              summary.write('Small hosted-runner results do not establish consumer-Mac or 8K throughput.\n')
          PY
